<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>dream-loop compare</title>
  <style>
    :root { color-scheme: dark; font-family: ui-sans-serif, system-ui, sans-serif; }
    body { margin: 0; background: #111; color: #eee; }
    h1 { font-size: 1rem; font-weight: 600; margin: 0; padding: 0.75rem 1rem; border-bottom: 1px solid #333; }
    .row { display: grid; grid-template-columns: 1fr 1fr minmax(12rem, 0.6fr); gap: 0.5rem; padding: 0.5rem; min-height: calc(100vh - 2.5rem); }
    figure { margin: 0; background: #1c1c1c; border: 1px solid #333; display: flex; flex-direction: column; min-width: 0; }
    figcaption { padding: 0.4rem 0.6rem; font-size: 0.8rem; color: #bbb; border-bottom: 1px solid #333; }
    img { width: 100%; height: 100%; object-fit: contain; background: #000; min-height: 12rem; }
    textarea { flex: 1; resize: none; border: 0; padding: 0.6rem; background: #1c1c1c; color: inherit; font: inherit; }
    .hint { padding: 0.4rem 0.6rem; font-size: 0.75rem; color: #888; }
  </style>
</head>
<body>
  <h1>dream-loop compare</h1>
  <div class="row">
    <figure>
      <figcaption>target</figcaption>
      <img src="/.dream-loop/target.png" alt="Target screenshot">
    </figure>
    <figure>
      <figcaption>live</figcaption>
      <img src="/.dream-loop/captures/latest.png" alt="Latest live capture">
    </figure>
    <figure>
      <figcaption>note</figcaption>
      <textarea id="note" placeholder="Round notes, blockers, FPS…"></textarea>
      <p class="hint">Served from preview-server at <code>/__compare</code>. Captures: <code>POST /__capture</code>.</p>
    </figure>
  </div>
</body>
</html>
